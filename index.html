<style>

/* Normal exploration parallax: far background slow, mid normal, foreground faster. */

.sideRoom.verticalRoute .assetBG{animation-duration:8s}
.sideRoom.verticalRoute .assetMID{animation-duration:5s}
.sideRoom.verticalRoute .assetFG,.sideRoom.verticalRoute .assetFloor{animation-duration:4s}

<style>

}
/* 바닥은 전경의 하단과 연결되는 얇은 보행선 */
.assetFloor{

function spriteKey(c){
  if(c.job==="기사")return "knight_m";
  if(c.job==="레인저")return c.gender==="여"?"elf_f":"elf_m";
  if(c.job==="마법사")return c.gender==="여"?"wizzard_f":"wizzard_m";
  if(c.job==="성직자")return "doc";
  if(c.job==="바드")return "pumpkin_dude";
  return "knight_m";
}
function spriteSrc(c,state="idle",frame=0){
  const pack=SPRITE_ASSETS[spriteKey(c)]||SPRITE_ASSETS.knight_m;
  const arr=pack[state]||pack.idle;
  return arr[frame%arr.length];
}
function spriteHTML(c,state="idle",extra=""){
  return `<img class="pixelChar ${extra}" data-char-id="${c.id}" data-sprite-state="${state}" src="${spriteSrc(c,state,0)}" alt="">`;
}
let spriteAnimFrame=0;
setInterval(()=>{

    const c=S.characters.find(x=>x.id===im.dataset.charId);
    if(c)im.src=spriteSrc(c,im.dataset.spriteState||"idle",spriteAnimFrame);
  });
},180);

function load(){try{const loaded=Object.assign(def(),JSON.parse(localStorage.getItem(CFG.SAVE)||"null")||{});/* v0.1.2 이하 호환: 완료 상태에 갇힌 세이브를 이어하기 상태로 복구 */if(loaded.phase==="done"){loaded.phase=(loaded.elapsedWork>=CFG.WORK_MIN)?"pausedOT":"paused";loaded.pausedExpedition=true;}/* v0.1.4 저녁 캠핑 무한정지 세이브 복구 */if(loaded.dinnerUsed&&loaded.dinnerUntil>loaded.elapsedWork&&!(loaded.dinnerRemaining>0)){loaded.dinnerRemaining=Math.max(0,loaded.dinnerUntil-loaded.elapsedWork);}if(!Array.isArray(loaded.characters)){loaded.characters=Array.isArray(loaded.party)?loaded.party:baseChars();}if(!Array.isArray(loaded.partyIds)){loaded.partyIds=loaded.characters.slice(0,CFG.MAX_PARTY).map(c=>c.id);}loaded.partyIds=loaded.partyIds.filter(id=>loaded.characters.some(c=>c.id===id)).slice(0,CFG.MAX_PARTY);delete loaded.party;return loaded}catch{return def()}}function save(){S.lastTick=Date.now();localStorage.setItem(CFG.SAVE,JSON.stringify(S))}function activeParty(){return S.partyIds.map(id=>S.characters.find(c=>c.id===id)).filter(Boolean)}function nowDate(){return new Date()}function dayKey(d=new Date()){return d.toISOString().slice(0,10)}function timeText(){return new Intl.DateTimeFormat("ko-KR",{hour:"2-digit",minute:"2-digit",hour12:true}).format(new Date())}function dateText(){return new Intl.DateTimeFormat("ko-KR",{year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date())}function weekText(){return ["일요일","월요일","화요일","수요일","목요일","금요일","토요일"][new Date().getDay()]}

function makeMaze(){const W=6,H=4,n=12,nodes=[{id:0,x:2,y:1,nb:[]}],occ=new Map([["2,1",0]]);while(nodes.length<n){const b=nodes[Math.floor(Math.random()*nodes.length)],ds=[[1,0],[-1,0],[0,1],[0,-1]].sort(()=>Math.random()-.5);let ok=false;for(const [dx,dy] of ds){const x=b.x+dx,y=b.y+dy,k=x+","+y;if(x<0||x>=W||y<0||y>=H||occ.has(k))continue;const id=nodes.length;nodes.push({id,x,y,nb:[b.id]});b.nb.push(id);occ.set(k,id);ok=true;break}if(!ok&&nodes.length<2)break}const acts=[];function dfs(u,p){for(const v of nodes[u].nb.filter(x=>x!==p).sort(()=>Math.random()-.5)){acts.push([u,v]);dfs(v,u);acts.push([v,u])}}dfs(0,-1);return{nodes,acts,revealed:[0],edges:[],cur:0}}

function endExpedition(){const wasOT=S.phase==="overtime";S.screen="town";S.pausedExpedition=true;if(wasOT){S.phase="pausedOT";makeReceipt("OT");S.settledOT=true}else if(S.elapsedWork>=CFG.WORK_MIN){S.phase="afterwork";makeReceipt("REG");S.settledRegular=true}else{S.phase="paused"}save();render();if(S.phase!=="paused")showLatestReceipt()}
function makeReceipt(type){const date=dayKey().replaceAll("-","").slice(2),seq="001";const paid=Math.min(S.goldFound,S.dailyCap),tax=Math.max(0,S.goldFound-S.dailyCap);S.kingdomTax=tax;const r={id:`${type==="OT"?"OT":"EXP"}-${date}-${seq}`,date:dayKey(),type,floor:S.floor,work:S.elapsedWork,gold:S.goldFound,cap:S.dailyCap,paid:type==="OT"?0:paid,tax:type==="OT"?0:tax,ot:S.otCoin};S.receipts.push(r);S.yesterday=`오늘 파티는 ${S.floor}층까지 탐험했습니다.`}
function showLatestReceipt(){const r=S.receipts[S.receipts.length-1];if(!r)return;openModal(`<div class="receiptWrap"><div class="receipt">왕국 모험가 ${r.type==="OT"?"야근":"보수"} 정산표\n────────────────\n전표번호  ${r.id}\n날짜      ${r.date}\n최종층    B${r.floor}F\n근무시간  ${Math.floor(r.work/60)}h ${Math.floor(r.work%60)}m\n발견 Gold ${r.gold}G\n지급한도  ${r.cap}G\n왕국귀속  ${r.tax}G\n실 지급액 ${r.paid}G\n야근수당  ${r.ot}◆\n────────────────\n정산 완료</div><div class="stampHint">※ 도장 애니메이션은 그래픽 고도화 단계에서 추가 예정</div><button class="full" onclick="closeModal()">확인</button></div>`)}
function dinner(){if(S.phase!=="overtime"||S.dinnerUsed)return;S.dinnerUsed=true;S.dinnerRemaining=CFG.DINNER_MIN;S.dinnerUntil=0;addLog("파티가 저녁식사 캠핑을 시작했습니다.","rest");say("저녁식사 시간! 파티가 30분 동안 캠핑합니다.");save();render()}
function vitality(){if(S.phase!=="overtime")return;S.vitalUntil=S.elapsedWork+20;say("활력 ON! 파티가 잠시 정상 컨디션을 되찾았습니다.");addLog("활력을 사용했습니다.");save()}

function hmToMin(v){const p=String(v||"").split(":").map(Number);return (p[0]||0)*60+(p[1]||0)}
function lunchCamping(){
  if(S.screen!=="dungeon"||S.phase!=="work")return false;
  const n=new Date(),now=n.getHours()*60+n.getMinutes(),a=hmToMin(S.lunchStart),b=hmToMin(S.lunchEnd);
  return b>a&&now>=a&&now<b;
}
function campingNow(){return lunchCamping()||(S.dinnerUsed&&S.dinnerRemaining>0)}

function minuteTick(){if(S.screen!=="dungeon"||S.pausedExpedition)return;let d=CFG.DEMO?1:(Date.now()-S.lastTick)/60000;if(!CFG.DEMO&&d>2)d=0;S.lastTick=Date.now();if(S.phase!=="work"&&S.phase!=="overtime")return;if(lunchCamping()){save();render();return}const dinnering=S.dinnerUsed&&S.dinnerRemaining>0;if(dinnering){S.dinnerRemaining=Math.max(0,S.dinnerRemaining-d);if(S.dinnerRemaining<=0){addLog("저녁식사를 마치고 야근 원정을 재개합니다.","rest");say("저녁식사 완료! 다시 원정을 시작합니다.",4000);}save();render();return}S.elapsedWork+=d;S.cycleMin=(S.cycleMin+d)%CFG.CYCLE;const c=S.cycleMin;if(c>=CFG.WELLNESS_AT&&c<CFG.WELLNESS_AT+CFG.WELLNESS_LEN){if(!S.wellnessActive){S.wellnessActive=true;addLog("파티가 잠시 몸을 풀었습니다.","wellness");say(["너무 오래 앉아 있었다면 잠깐 일어나자!","50분 탐험 완료! 잠깐 일어나 움직여요.","어깨 한번 쭉 펴볼까요?","물 한 잔 마시고 다시 출발!"][Math.floor(Math.random()*4)],5500)}}else S.wellnessActive=false;if(S.phase==="work"&&S.elapsedWork>=CFG.WORK_MIN){S.phase="overtime";addLog("정규 근무가 끝났습니다. 자동으로 야근 환경으로 전환합니다.","ot");say("정규 근무 종료. 아직 탐험 중이므로 야근 모드로 전환합니다.",5000)}if(!S.wellnessActive){if(S.elapsedWork>=S.nextMoveAt){
      const beforeMaze=S.currentMaze,beforeNode=beforeMaze&&beforeMaze.nodes?beforeMaze.nodes[beforeMaze.cur]:null;
      const beforeDegree=beforeNode&&beforeNode.nb?beforeNode.nb.length:0;
      const beforeDead=beforeDegree<=1&&beforeMaze&&beforeMaze.cur!==0;
      const beforeAct=beforeMaze&&beforeMaze.acts?beforeMaze.acts[S.moveCursor]:null;
      let visualExit="edge",visualExitSide=S.roomEntrySide==="left"?"right":"left";
      if(beforeDead){
        visualExit="dead";
        visualExitSide=S.roomEntrySide;
      }else if(beforeAct&&beforeMaze.nodes[beforeAct[0]]&&beforeMaze.nodes[beforeAct[1]]){
        const bf=beforeMaze.nodes[beforeAct[0]],bt=beforeMaze.nodes[beforeAct[1]];
        if(Math.abs(bt.y-bf.y)>.5)visualExit="door";
        else visualExitSide=bt.x>bf.x?"right":"left";
      }
      if(visualExit==="door"){
        S.pendingEntrySide=(S.dungeonFace||1)>0?"left":"right";
      }else{
        S.pendingEntrySide=visualExitSide==="left"?"right":"left";
      }
      moveParty();
      if(S.pendingEntrySide){S.roomEntrySide=S.pendingEntrySide;S.pendingEntrySide=null}
      const mm=S.currentMaze,aa=mm&&mm.acts&&mm.acts[S.moveCursor];
      let visualMin=CFG.MOVE_EVERY_MIN;
      if(mm&&mm.nodes&&mm.nodes[mm.cur]&&mm.nodes[mm.cur].nb&&mm.nodes[mm.cur].nb.length<=1&&mm.cur!==0){
        visualMin=CFG.MOVE_EVERY_MIN*2;
      }else if(aa&&mm.nodes[aa[0]]&&mm.nodes[aa[1]]){
        const f=mm.nodes[aa[0]],t=mm.nodes[aa[1]];
        if(Math.abs(t.y-f.y)>.5)visualMin=CFG.MOVE_EVERY_MIN/2;
      }
      S.nextMoveAt=S.elapsedWork+visualMin;
    }if(Math.random()<.18){const g=1+Math.floor(Math.random()*5);if(S.phase==="work"){S.goldFound+=g;if(Math.random()<.3)say(`보물 발견 · +${g}G`)}else{S.otCoin+=1;if(Math.random()<.25)say("야근수당 +1◆")}}}save();render()}

function hasBatchim(name){const ch=(name||"").slice(-1),code=ch.charCodeAt(0);if(code>=0xAC00&&code<=0xD7A3)return (code-0xAC00)%28!==0;return null}

  const m=S.currentMaze||makeMaze();S.currentMaze=m;
  const overtime=S.phase==="overtime",cur=m.cur,node=m.nodes[cur]||m.nodes[0],degree=node&&node.nb?node.nb.length:1;
  const prevAct=S.moveCursor>0&&m.acts?m.acts[S.moveCursor-1]:null;
  const nextAct=m.acts&&m.acts[S.moveCursor]?m.acts[S.moveCursor]:null;
  /* v0.6.9: room entry is inherited from the previous room's VISUAL exit.
     It is intentionally independent from the hidden maze's x/y orientation. */
  let entrySide=S.roomEntrySide||"left";
  let exitType="edge",exitSide=entrySide==="left"?"right":"left",nextVertical=false;
  if(nextAct&&m.nodes[nextAct[0]]&&m.nodes[nextAct[1]]){
    const c=m.nodes[nextAct[0]],n=m.nodes[nextAct[1]];
    nextVertical=Math.abs(n.y-c.y)>.5;
    if(nextVertical)exitType="door";
    else exitSide=n.x>c.x?"right":"left";
  }
  const dead=degree<=1&&cur!==0;
  if(dead){exitType="dead";exitSide=entrySide}
  const junction=degree>=3;
  const initialFace=entrySide==="left"?1:-1;
  S.dungeonFace=initialFace;
  const roomKey=`${S.floor}:${cur}:${S.moveCursor}:${entrySide}:${exitType}:${exitSide}`;
  const campMode=campingNow();
  if(S.lastRenderedRoom===roomKey&&scene.querySelector(".sideRoom")&&scene.querySelector(".sideRoom").classList.contains("camping")===campMode){
    const r=scene.querySelector(".sideRoom");r.style.filter=overtime?"brightness(.62) saturate(.8)":"";
    return;
  }
  const floorChanged=S.lastRenderedFloor!=null&&S.lastRenderedFloor!==S.floor;
  S.lastRenderedRoom=roomKey;S.lastRenderedFloor=S.floor;
  let motionClass="";
  if(dead)motionClass=entrySide==="left"?"deadFromL":"deadFromR";
  else if(exitType==="door")motionClass=entrySide==="left"?"enterLExitDoor":"enterRExitDoor";
  else motionClass=entrySide==="left"?"enterLExitR":"enterRExitL";
  const sceneVariant=((S.floor+cur)%2===0)?"sceneA":"sceneB";
  const roomClass=`sideRoom ${campMode?"camping":""} ${initialFace>0?"scrollR":"scrollL"} ${dead?`deadRoom deadReturnScroll ${entrySide==="left"?"outFromLeft returnRight":"outFromRight returnLeft"}`:""} ${exitType==="door"?"verticalRoute":""} ${sceneVariant}`;
  const wallSide=entrySide==="left"?"right":"left";
  const vt=visualTheme(),va=VISUAL_ASSETS[vt],objs=roomObjects(vt,cur);
  scene.innerHTML=`<div class="${roomClass}" style="${overtime?'filter:brightness(.62) saturate(.8)':''}">
    <div class="assetLayer assetMID" style="background-image:url('${assetPath("backgrounds",vt,vt+"_mid.png")}')"></div>
    <div class="assetFloor" style="background-image:url('${assetPath("tiles",vt,va.floor)}')"></div>
    <img class="assetObj o1 ${objectSizeClass(objs[0])}" src="${assetPath("objects",vt,objs[0])}" alt="">
    <img class="assetObj o2 ${objectSizeClass(objs[1])}" src="${assetPath("objects",vt,objs[1])}" alt="">
    ${junction?`<div class="sideDoorLabel">${degree===4?"사거리":"삼거리"} · 통로</div>`:""}
    ${dead?`<div class="assetWallEnd ${wallSide}" style="background-image:url('${assetPath("tiles",vt,va.wall)}')"></div>`:""}
    <div class="assetLayer assetFG" style="background-image:url('${assetPath("backgrounds",vt,vt+"_fg.png")}')"></div>
    <div class="sideParty ${motionClass}" id="sideParty"></div>
  </div>${floorChanged?`<div class="floorFade"><span>B${S.floor}F</span></div>`:""}`;
  // v0.6.9 — background motion is tied directly to this rendered room.
  // No dependency on scrollR/scrollL CSS animation triggering.
  const roomEl=scene.querySelector(".sideRoom");
  const midEl=roomEl&&roomEl.querySelector(".assetMID");
  const fgEl=roomEl&&roomEl.querySelector(".assetFG");
  const dir=entrySide==="left"?-1:1; // party right => scenery left
  const duration=dead?16000:(exitType==="door"?4000:8000);

  function playLayerPan(el, distance){
    if(!el)return;
    const d=dir*distance;
    if(dead){
      el.animate([
        {transform:"translate3d(0,0,0)",offset:0},
        {transform:"translate3d(0,0,0)",offset:.16},
        {transform:`translate3d(${d}px,0,0)`,offset:.48},
        {transform:`translate3d(${d}px,0,0)`,offset:.54},
        {transform:"translate3d(0,0,0)",offset:.90},
        {transform:"translate3d(0,0,0)",offset:1}
      ],{duration,easing:"linear",fill:"both"});
    }else{
      el.animate([
        {transform:"translate3d(0,0,0)",offset:0},
        {transform:"translate3d(0,0,0)",offset:.24},
        {transform:`translate3d(${d}px,0,0)`,offset:.82},
        {transform:`translate3d(${d}px,0,0)`,offset:1}
      ],{duration,easing:"linear",fill:"both"});
    }
  }
  // MID/FG are equal foreground variants; only the visible strip moves.
  const activeForeground=roomEl&&roomEl.classList.contains("sceneA")?midEl:fgEl;
  if(!campMode)playLayerPan(activeForeground,92);

  const box=$("#sideParty"),party=activeParty(),offsets=[[-50,0],[-30,2],[-10,0],[10,3],[30,1],[50,4]];
  party.forEach((c,i)=>{
    const [ox,oy]=offsets[i]||[0,0];
    box.insertAdjacentHTML("beforeend",`<div class="sideMember" style="left:${ox}px;bottom:${oy}px"><div class="dName">${c.name}</div>${spriteHTML(c,"run")}</div>`)
  });
  const imgs=box.querySelectorAll(".pixelChar");
  const setFacing=f=>imgs.forEach(im=>im.style.transform=f>0?"scaleX(1)":"scaleX(-1)");
  setFacing(initialFace);
  if(dead&&!campMode){
    /* Turn once at the wall, halfway through the 16-second round trip. */
    setTimeout(()=>{if(box.isConnected)setFacing(-initialFace)},8000);
  }
  if(campMode){
    const camp= document.createElement("div");
    camp.className="campLayer";
    camp.innerHTML=`<img class="campFire" src="${CAMPFIRE_APNG}" alt="">`;
    const poses=["rest1","rest2","rest3","rest4","roamL","roamR"];
    party.forEach((c,i)=>{
      const wrap=document.createElement("div");
      wrap.className=`campMember ${poses[i%poses.length]}`;
      wrap.innerHTML=`<div class="dName">${c.name}</div>${spriteHTML(c,i<4?"idle":"run")}`;
      camp.appendChild(wrap);
    });
    roomEl.appendChild(camp);
  }
  if(lunchCamping()){
    ticker.style.display="block";
    tickerText.textContent=`점심 캠핑 중 · 파티가 캠프파이어 주변에서 쉬고 있습니다. · `
  }else if(S.dinnerUsed&&S.dinnerRemaining>0){
    ticker.style.display="block";
    tickerText.textContent=`저녁 캠핑 중 · 남은 ${Math.ceil(S.dinnerRemaining)}분 · 파티가 식사하고 쉬고 있습니다. · 오늘의 원정 로그를 천천히 돌아봅니다. · `
  }
}
function renderControls(){if(S.screen==="town"){controls.innerHTML=`<div class="bottomLog"><span>${S.yesterday}</span><span class="versionInfo">${APP_VERSION}</span></div>`;return}const last=S.logs.length?S.logs[S.logs.length-1]:null;const text=currentNotice|| (S.wellnessActive?"너무 오래 앉아 있었다면 잠깐 일어나자!":last?`${last.at} · ${last.t}`:"파티가 자동으로 탐험하고 있습니다.");const isRare=(currentNotice&&currentNotice.startsWith("희귀 이벤트"))||(!currentNotice&&last&&last.kind==="rare");const night=S.phase==="overtime"?`<div class="bottomNightActions"><button onclick="dinner()" ${S.dinnerUsed?"disabled":""}>저녁식사</button><button onclick="vitality()">활력</button></div>`:"";controls.innerHTML=`<div class="bottomLog ${isRare?"rareLog":""}"><span>${text}</span><span class="versionInfo">${APP_VERSION}</span></div>${night}`}

window.settingsMenu=()=>openModal(`<div class="modalTitle">설정</div><div class="formRow"><span>점심 시작</span><input id="ls" type="time" value="${S.lunchStart}"></div><div class="formRow"><span>점심 종료</span><input id="le" type="time" value="${S.lunchEnd}"></div><button class="full" onclick="saveSettings()">저장</button><button class="full" onclick="openMenu()">돌아가기</button>`);window.saveSettings=()=>{S.lunchStart=$("#ls").value;S.lunchEnd=$("#le").value;save();say("점심시간 설정을 저장했습니다.");openMenu()};
window.partySetup=()=>{const active=new Set(S.partyIds);const current=S.characters.filter(c=>active.has(c.id));const waiting=S.characters.filter(c=>!active.has(c.id));const row=(c)=>`<div class="formRow" style="align-items:flex-start;gap:8px"><div style="flex:1;min-width:0"><div><b>${c.job} · ${c.name}</b></div><div class="traits" style="margin-top:7px">${(c.traits||[]).slice(0,3).map(t=>`<i class="chip">${t}</i>`).join("")||`<i class="chip">특징 없음</i>`}</div></div><button type="button" onclick="editCharacterById('${c.id}')" class="compactCtl">EDIT</button><button type="button" onclick="toggleParty('${c.id}')" class="compactCtl">${active.has(c.id)?'제외':'편성'}</button></div>`;openModal(`<div class="modalTitle" style="text-align:left">파티 구성 · 근무 설정</div><div class="subtle" style="margin-bottom:6px">현재 파티 ${current.length}/${CFG.MAX_PARTY} · 보유 캐릭터 ${S.characters.length}/${CFG.MAX_CHARACTERS}</div><div class="editSection">현재 파티</div>${current.map(row).join('')||'<div class="subtle">편성된 캐릭터가 없습니다.</div>'}<div class="editSection">대기 캐릭터</div>${waiting.map(row).join('')||'<div class="subtle">대기 캐릭터가 없습니다.</div>'}<button class="full" onclick="newCharacter()" ${S.characters.length>=CFG.MAX_CHARACTERS?'disabled':''}>+ 캐릭터 추가 (${S.characters.length}/${CFG.MAX_CHARACTERS})</button><div class="formRow"><span>점심 시작</span><input id="pls" class="compactCtl" type="time" value="${S.lunchStart}"></div><div class="formRow"><span>점심 종료</span><input id="ple" class="compactCtl" type="time" value="${S.lunchEnd}"></div><div class="partySetupActions"><button class="full" onclick="savePartySetup()">저장</button><button class="full" onclick="closeModal()">돌아가기</button></div>`)};
window.toggleParty=(id)=>{const p=S.partyIds.indexOf(id);if(p>=0){S.partyIds.splice(p,1)}else{if(S.partyIds.length>=CFG.MAX_PARTY){say(`파티는 최대 ${CFG.MAX_PARTY}명까지 편성할 수 있습니다.`);return}S.partyIds.push(id)}save();partySetup()};
window.newCharacter=()=>{if(S.characters.length>=CFG.MAX_CHARACTERS){say(`캐릭터는 최대 ${CFG.MAX_CHARACTERS}명까지 생성할 수 있습니다.`);return}const id='c'+Date.now();S.characters.push({id,name:'새 캐릭터',gender:'남',glasses:false,hair:'짧음',job:'기사',stats:{STR:1,VIT:1,DEX:1,INT:1,LUK:1},traits:[]});save();editCharacterById(id,true)};
let editingCharIndex=-1,editingTraits=[];
window.editCharacterById=(id,isNew=false)=>{editingCharIndex=S.characters.findIndex(c=>c.id===id);const c=S.characters[editingCharIndex];editingTraits=[...(c.traits||[])].slice(0,3);openModal(`<div class="modalTitle">CHARACTER EDIT</div><div class="formRow"><span>이름</span><input id="ceName" maxlength="12" value="${c.name.replaceAll('&','&amp;').replaceAll('\"','&quot;').replaceAll('<','&lt;').replaceAll('>','&gt;')}"></div><div class="editSection">성별</div><div class="choiceRow"><button id="genderM" class="choiceBtn ${c.gender==='남'?'on':''}" onclick="setEditChoice('gender','남')">남</button><button id="genderF" class="choiceBtn ${c.gender==='여'?'on':''}" onclick="setEditChoice('gender','여')">여</button></div><input type="hidden" id="ceGender" value="${c.gender}"><div class="formRow"><span>직업</span><select id="ceJob"><option ${c.job==='기사'?'selected':''}>기사</option><option ${c.job==='레인저'?'selected':''}>레인저</option><option ${c.job==='마법사'?'selected':''}>마법사</option><option ${c.job==='성직자'?'selected':''}>성직자</option><option ${c.job==='바드'?'selected':''}>바드</option></select></div><div class="formRow"><span>머리 길이</span><select id="ceHair"><option ${c.hair==='짧음'?'selected':''}>짧음</option><option ${c.hair==='중간'?'selected':''}>중간</option><option ${c.hair==='김'?'selected':''}>김</option></select></div><div class="formRow"><span>안경</span><select id="ceGlasses"><option value="false" ${!c.glasses?'selected':''}>OFF</option><option value="true" ${c.glasses?'selected':''}>ON</option></select></div><div class="editSection">STATUS · 1~999</div><div class="statGrid">${['STR','VIT','DEX','INT','LUK'].map(k=>`<label class="statBox">${k}<input id="stat${k}" type="number" min="1" max="999" value="${c.stats?.[k]??1}"></label>`).join('')}</div><div class="editSection">특징 · 최대 3개 <span id="traitCount" class="subtle">(${editingTraits.length}/3)</span></div><div class="traitPick">${TRAITS.map(t=>`<button type="button" class="choiceBtn ${editingTraits.includes(t)?'on':''}" data-trait="${t}" onclick="toggleEditTrait('${t}',this)">${t}</button>`).join('')}</div><div class="editorActions"><button onclick="saveCharacterEdit()">저장</button><button onclick="partySetup()">취소</button></div><button class="full" style="margin-top:7px" onclick="deleteCharacter()">캐릭터 삭제</button>`)};

window.saveCharacterEdit=()=>{const i=editingCharIndex,c=S.characters[i];if(!c)return;const name=$('#ceName').value.trim();if(!name){say('이름을 입력해주세요.');return}const stats={};for(const k of ['STR','VIT','DEX','INT','LUK']){let v=parseInt($('#stat'+k).value,10);if(!Number.isFinite(v))v=1;stats[k]=Math.max(1,Math.min(999,v))}c.name=name;c.gender=$('#ceGender').value;c.job=$('#ceJob').value;c.hair=$('#ceHair').value;c.glasses=$('#ceGlasses').value==='true';c.stats=stats;c.traits=[...editingTraits];save();partySetup()};

(function(){
  const last=new WeakMap();
  function syncTownFacing(){
    document.querySelectorAll(".townHero").forEach(el=>{
      const im=el.querySelector(".pixelChar");
      if(!im)return;
      const x=el.getBoundingClientRect().left;
      const prev=last.get(el);
      if(prev!==undefined){
        const dx=x-prev;
        if(Math.abs(dx)>.08) im.style.transform=dx>0?"scaleX(1)":"scaleX(-1)";
      }
      last.set(el,x);
    });
    requestAnimationFrame(syncTownFacing);
  }
  requestAnimationFrame(syncTownFacing);
})();
