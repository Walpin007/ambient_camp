<style>

*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:"Courier New","Apple SD Gothic Neo",monospace;-webkit-user-select:none;user-select:none}body{display:flex;justify-content:center;padding:10px 8px calc(10px + var(--safe))}

.startOverlay{position:absolute;left:50%;top:72px;transform:translateX(-50%);width:min(92%,400px);text-align:center}.townStart{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(72%,280px);z-index:12;min-height:54px;font-size:15px}.bottomLog{grid-column:1/-1;border:3px double var(--line);background:#09090d;color:#d8d1b9;min-height:52px;padding:10px 12px;display:flex;align-items:center;font-size:11px;line-height:1.35;position:relative;padding-right:68px}.versionInfo{position:absolute;right:8px;bottom:6px;font-size:8px;color:#777;white-space:nowrap}.bottomLog.rareLog{color:#ffd866;border-color:#b99228;text-shadow:0 0 4px rgba(255,216,102,.55),0 0 9px rgba(255,190,45,.25)}

@keyframes rareSparkle{0%,100%{opacity:.82;text-shadow:0 0 2px rgba(255,216,102,.35)}50%{opacity:1;text-shadow:0 0 5px rgba(255,231,145,.95),0 0 11px rgba(255,190,45,.5)}}
.bottomLog .muted{color:var(--muted)}.date{font-size:15px;color:var(--muted);letter-spacing:2px}.clock{font-size:27px;font-weight:900;margin:7px 0 16px;letter-spacing:1px}.jrpg{border:3px double var(--line);background:#0b0b11eF;padding:8px;text-align:left}.jrpg .item{padding:7px 8px}.jrpg .item::before{content:"  "}.jrpg .item.sel::before{content:"▶ "}.yesterday{display:none}
.dungeon{position:absolute;inset:0;transition:filter 1s,background 1s}.maze{position:absolute;left:50%;top:54%;width:390px;height:250px;transform:translate(-50%,-50%)}.edge{position:absolute;height:3px;background:#47434a;transform-origin:0 50%}.edge.on{background:#c7bea1}.node{position:absolute;width:20px;height:20px;transform:translate(-50%,-50%);border:2px solid #4d4950;background:#111018;display:grid;place-items:center;font-size:8px}.node.on{border-color:#d9d1b6}.node.cur{background:#efe5c6;color:#111;border-color:#fff}.partyDot{position:absolute;width:11px;height:11px;border:2px solid #fff;background:#222;transform:translate(-50%,-50%);z-index:8;transition:left .8s linear,top .8s linear}.monster{position:absolute;font-size:18px;z-index:7;transition:transform .2s}.monster.stun{animation:stun .4s steps(2,end) infinite}@keyframes stun{50%{transform:rotate(-12deg)}}
.message{position:absolute;left:14px;right:14px;bottom:18px;border:3px double var(--line);background:#09090deb;padding:10px 12px;min-height:48px;font-size:12px;z-index:80;display:none}.message.show{display:block}.nightActions{position:absolute;right:12px;bottom:80px;display:flex;gap:6px;z-index:22}.nightActions button{background:#17141d}.wellnessBadge{position:absolute;left:12px;bottom:80px;font-size:10px;color:#d7cfb5;z-index:22}
.modal{position:absolute;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:40;padding:18px}.modal.show{display:flex}.modalPanel{width:min(100%,380px);max-height:86%;overflow:auto;border:4px double var(--line);background:#0b0b11;padding:12px}.modalTitle{text-align:center;font-weight:900;margin-bottom:10px}.menuRow{padding:9px;border-bottom:1px dotted #59545d;cursor:pointer}.menuRow::before{content:"▶ ";color:var(--accent)}.subtle{font-size:10px;color:var(--muted)}.formRow{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:center;padding:7px 0;border-bottom:1px dotted #4c4850}.formRow input,.formRow select{width:100%;background:#050508;color:#fff;border:1px solid #aaa;padding:6px;font-family:inherit}.compactCtl{width:64px!important;min-width:64px;height:32px;min-height:32px;padding:4px 6px!important}.traits{display:flex;gap:4px;flex-wrap:wrap}.chip{border:1px solid #777;padding:2px 4px;font-size:9px}.editSection{margin:10px 0 6px;padding-top:8px;border-top:1px solid #4c4850;font-size:10px;font-weight:900;color:var(--accent)}.choiceRow{display:flex;gap:5px;flex-wrap:wrap}.choiceBtn{min-height:32px;padding:5px 8px;border:1px solid #777;background:#111118;color:#ddd}.choiceBtn.on{background:#e8dfc2;color:#111;border-color:#fff}.statGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.statBox{text-align:center;font-size:9px}.statBox input{width:100%;margin-top:4px;text-align:center;background:#050508;color:#fff;border:1px solid #aaa;padding:6px;font-family:inherit}.traitPick{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}.traitPick button{min-height:30px;padding:4px;font-size:9px}.editorActions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}.partySetupActions{margin-top:22px;padding-top:12px;border-top:1px solid #4c4850;display:grid;gap:18px}.receipt{font-size:11px;line-height:1.6;white-space:pre-wrap;border:2px dashed #bcb49a;padding:12px;background:#f0e8cf;color:#17130f}.receiptWrap{animation:rise .55s ease-out}@keyframes rise{from{transform:translateY(70px);opacity:0}to{transform:none;opacity:1}}.stampHint{font-size:9px;color:#777;margin-top:8px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:7px}.controls button{min-height:44px}.full{grid-column:1/-1}.bottomNightActions{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:7px}.bottomNightActions button{min-height:44px}.bottomLog{grid-column:1/-1}.ticker{position:absolute;left:0;right:0;bottom:0;height:26px;border-top:2px solid #817a67;background:#08080b;overflow:hidden;white-space:nowrap;display:none}.ticker span{display:inline-block;padding-left:100%;animation:ticker 18s linear infinite;font-size:10px;line-height:24px}@keyframes ticker{to{transform:translateX(-100%)}}
@media(max-height:720px){.stage{height:clamp(320px,54dvh,430px)}.maze{height:210px}.startOverlay{top:60px}.clock{font-size:24px}.yesterday{bottom:72px}}
</style></head><body>
<main id="game"><section class="box stage"><div id="scene"></div><button id="menuBtn" class="menuBtn">MENU</button><div id="dungeonHud" class="hudCenter"><div id="topFloor" class="floor"></div><div id="topSub" class="hudTheme"></div></div><div id="modeText" class="modeHud">OFF</div><div id="message" class="message"></div><div id="wellnessBadge" class="wellnessBadge"></div><div id="nightActions" class="nightActions"></div><div id="ticker" class="ticker"><span id="tickerText"></span></div><div id="modal" class="modal"><div id="modalPanel" class="modalPanel"></div></div></section><section id="controls" class="controls"></section></main>
<script>
"use strict";
const APP_VERSION="v0.3.3";
const CFG={SAVE:"workday_ambient_v01",DEMO:true,DEMO_MINUTE_MS:500,WORK_MIN:480,WELLNESS_AT:50,WELLNESS_LEN:1,CYCLE:60,DINNER_MIN:30,MOVE_EVERY_MIN:2,MAX_PARTY:6,MAX_CHARACTERS:15,RARE_PER_WORKDAY:1};
const THEMES=["폐허","용암","늪·수로","숲","보석·금광"];const TRAITS=["커피광","잠꾸러기","수다쟁이","과묵함","길치","호기심","겁쟁이","성급함","느긋함","먹보","깔끔함","덤벙댐","허세","장난꾸러기","꼼꼼함","부지런함","야행성","아침형","흥부자","긍정왕"];
const $=s=>document.querySelector(s);const scene=$("#scene"),controls=$("#controls"),modal=$("#modal"),panel=$("#modalPanel"),msg=$("#message"),nightActions=$("#nightActions"),ticker=$("#ticker"),tickerText=$("#tickerText");
function baseChars(){return[{id:"c1",name:"아서",gender:"남",glasses:false,hair:"짧음",job:"기사",stats:{STR:5,VIT:4,DEX:2,INT:2,LUK:3},traits:["부지런함","허세","성급함"]},{id:"c2",name:"로빈",gender:"여",glasses:false,hair:"중간",job:"레인저",stats:{STR:2,VIT:3,DEX:5,INT:3,LUK:4},traits:["호기심","성급함","길치"]},{id:"c3",name:"메를린",gender:"남",glasses:true,hair:"김",job:"마법사",stats:{STR:1,VIT:2,DEX:3,INT:5,LUK:3},traits:["커피광","잠꾸러기","야행성"]},{id:"c4",name:"리아",gender:"여",glasses:false,hair:"중간",job:"성직자",stats:{STR:2,VIT:5,DEX:2,INT:4,LUK:3},traits:["긍정왕","깔끔함","꼼꼼함"]}]}
function def(){const chars=baseChars();return{v:2,screen:"town",phase:"off",characters:chars,partyIds:chars.map(c=>c.id),lunchStart:"12:00",lunchEnd:"13:00",startedAt:null,elapsedWork:0,cycleMin:0,floor:1,goldFound:0,dailyCap:0,otCoin:0,kingdomTax:0,logs:[],receipts:[],currentMaze:null,moveCursor:0,lastTick:Date.now(),pausedExpedition:false,dinnerUsed:false,wellnessUntil:0,dinnerUntil:0,dinnerRemaining:0,lastDay:null,yesterday:"어제의 기록이 아직 없습니다.",settledRegular:false,settledOT:false,rareEventsToday:0}}
/* v0.2.1 TEST MIGRATION: 기존 v0.1.x/v0.2.0 로컬 세이브를 이번 버전에서 1회만 강제 초기화 */
const RESET_MARK="workday_ambient_v021_reset_done";
if(!localStorage.getItem(RESET_MARK)){localStorage.removeItem(CFG.SAVE);localStorage.setItem(RESET_MARK,"1");}
let S=load();let timerMsg=null;let currentNotice="";
function load(){try{const loaded=Object.assign(def(),JSON.parse(localStorage.getItem(CFG.SAVE)||"null")||{});/* v0.1.2 이하 호환: 완료 상태에 갇힌 세이브를 이어하기 상태로 복구 */if(loaded.phase==="done"){loaded.phase=(loaded.elapsedWork>=CFG.WORK_MIN)?"pausedOT":"paused";loaded.pausedExpedition=true;}/* v0.1.4 저녁 캠핑 무한정지 세이브 복구 */if(loaded.dinnerUsed&&loaded.dinnerUntil>loaded.elapsedWork&&!(loaded.dinnerRemaining>0)){loaded.dinnerRemaining=Math.max(0,loaded.dinnerUntil-loaded.elapsedWork);}if(!Array.isArray(loaded.characters)){loaded.characters=Array.isArray(loaded.party)?loaded.party:baseChars();}if(!Array.isArray(loaded.partyIds)){loaded.partyIds=loaded.characters.slice(0,CFG.MAX_PARTY).map(c=>c.id);}loaded.partyIds=loaded.partyIds.filter(id=>loaded.characters.some(c=>c.id===id)).slice(0,CFG.MAX_PARTY);delete loaded.party;return loaded}catch{return def()}}function save(){S.lastTick=Date.now();localStorage.setItem(CFG.SAVE,JSON.stringify(S))}function activeParty(){return S.partyIds.map(id=>S.characters.find(c=>c.id===id)).filter(Boolean)}function nowDate(){return new Date()}function dayKey(d=new Date()){return d.toISOString().slice(0,10)}function timeText(){return new Intl.DateTimeFormat("ko-KR",{hour:"2-digit",minute:"2-digit",hour12:true}).format(new Date())}function dateText(){return new Intl.DateTimeFormat("ko-KR",{year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date())}function weekText(){return ["일요일","월요일","화요일","수요일","목요일","금요일","토요일"][new Date().getDay()]}
function theme(){const d=new Date().getDay();return d===0||d===6?THEMES[(S.floor-1)%5]:THEMES[Math.max(0,d-1)]}function addLog(t,kind="event"){S.logs.push({at:timeText(),t,kind});if(S.logs.length>300)S.logs.shift()}function say(t,ms=3500){clearTimeout(timerMsg);currentNotice=t;if(S.screen==="dungeon"){msg.classList.remove("show");renderControls()}else{msg.textContent=t;msg.classList.add("show")}timerMsg=setTimeout(()=>{currentNotice="";msg.classList.remove("show");renderControls()},ms)}
function makeMaze(){const W=6,H=4,n=12,nodes=[{id:0,x:2,y:1,nb:[]}],occ=new Map([["2,1",0]]);while(nodes.length<n){const b=nodes[Math.floor(Math.random()*nodes.length)],ds=[[1,0],[-1,0],[0,1],[0,-1]].sort(()=>Math.random()-.5);let ok=false;for(const [dx,dy] of ds){const x=b.x+dx,y=b.y+dy,k=x+","+y;if(x<0||x>=W||y<0||y>=H||occ.has(k))continue;const id=nodes.length;nodes.push({id,x,y,nb:[b.id]});b.nb.push(id);occ.set(k,id);ok=true;break}if(!ok&&nodes.length<2)break}const acts=[];function dfs(u,p){for(const v of nodes[u].nb.filter(x=>x!==p).sort(()=>Math.random()-.5)){acts.push([u,v]);dfs(v,u);acts.push([v,u])}}dfs(0,-1);return{nodes,acts,revealed:[0],edges:[],cur:0}}
function startDay(){if(activeParty().length<1){say("원정에 참가할 캐릭터를 1명 이상 편성해주세요.");return}S.screen="dungeon";S.phase="work";S.startedAt=Date.now();S.elapsedWork=0;S.cycleMin=0;S.floor=1;S.goldFound=0;S.otCoin=0;S.kingdomTax=0;S.dailyCap=80+Math.floor(Math.random()*41);S.logs=[];S.currentMaze=makeMaze();S.moveCursor=0;S.pausedExpedition=false;S.dinnerUsed=false;S.dinnerRemaining=0;S.dinnerUntil=0;S.settledRegular=false;S.settledOT=false;S.rareEventsToday=0;addLog("오늘의 원정을 시작했습니다.");say(`왕국 재무부 승인 · 금일 지급한도 ${S.dailyCap}G`);save();render()}
function resume(kind){S.screen="dungeon";S.pausedExpedition=false;S.phase=kind==="ot"?"overtime":"work";addLog(kind==="ot"?"야근 원정을 이어갑니다.":"원정을 이어갑니다.");save();render()}
function openPortal(){S.pausedExpedition=true;S.portalStun=true;addLog("절대자의 개입으로 원정 이동이 즉시 정지했습니다.","portal");save();render();say("절대자의 위엄이 던전을 뒤덮습니다. 몬스터들이 스턴에 빠졌습니다!",1800);setTimeout(()=>{say("퇴근 포탈이 내려왔습니다. 파티가 마을로 귀환합니다!",1800);setTimeout(()=>{S.portalStun=false;endExpedition()},1800)},1800)}
function endExpedition(){const wasOT=S.phase==="overtime";S.screen="town";S.pausedExpedition=true;if(wasOT){S.phase="pausedOT";makeReceipt("OT");S.settledOT=true}else if(S.elapsedWork>=CFG.WORK_MIN){S.phase="afterwork";makeReceipt("REG");S.settledRegular=true}else{S.phase="paused"}save();render();if(S.phase!=="paused")showLatestReceipt()}
function makeReceipt(type){const date=dayKey().replaceAll("-","").slice(2),seq="001";const paid=Math.min(S.goldFound,S.dailyCap),tax=Math.max(0,S.goldFound-S.dailyCap);S.kingdomTax=tax;const r={id:`${type==="OT"?"OT":"EXP"}-${date}-${seq}`,date:dayKey(),type,floor:S.floor,work:S.elapsedWork,gold:S.goldFound,cap:S.dailyCap,paid:type==="OT"?0:paid,tax:type==="OT"?0:tax,ot:S.otCoin};S.receipts.push(r);S.yesterday=`오늘 파티는 ${S.floor}층까지 탐험했습니다.`}
function showLatestReceipt(){const r=S.receipts[S.receipts.length-1];if(!r)return;openModal(`<div class="receiptWrap"><div class="receipt">왕국 모험가 ${r.type==="OT"?"야근":"보수"} 정산표\n────────────────\n전표번호  ${r.id}\n날짜      ${r.date}\n최종층    B${r.floor}F\n근무시간  ${Math.floor(r.work/60)}h ${Math.floor(r.work%60)}m\n발견 Gold ${r.gold}G\n지급한도  ${r.cap}G\n왕국귀속  ${r.tax}G\n실 지급액 ${r.paid}G\n야근수당  ${r.ot}◆\n────────────────\n정산 완료</div><div class="stampHint">※ 도장 애니메이션은 그래픽 고도화 단계에서 추가 예정</div><button class="full" onclick="closeModal()">확인</button></div>`)}
function dinner(){if(S.phase!=="overtime"||S.dinnerUsed)return;S.dinnerUsed=true;S.dinnerRemaining=CFG.DINNER_MIN;S.dinnerUntil=0;addLog("파티가 저녁식사 캠핑을 시작했습니다.","rest");say("저녁식사 시간! 파티가 30분 동안 캠핑합니다.");save();render()}
function vitality(){if(S.phase!=="overtime")return;S.vitalUntil=S.elapsedWork+20;say("활력 ON! 파티가 잠시 정상 컨디션을 되찾았습니다.");addLog("활력을 사용했습니다.");save()}
function minuteTick(){if(S.screen!=="dungeon"||S.pausedExpedition)return;let d=CFG.DEMO?1:(Date.now()-S.lastTick)/60000;if(!CFG.DEMO&&d>2)d=0;S.lastTick=Date.now();if(S.phase!=="work"&&S.phase!=="overtime")return;const dinnering=S.dinnerUsed&&S.dinnerRemaining>0;if(dinnering){S.dinnerRemaining=Math.max(0,S.dinnerRemaining-d);if(S.dinnerRemaining<=0){addLog("저녁식사를 마치고 야근 원정을 재개합니다.","rest");say("저녁식사 완료! 다시 원정을 시작합니다.",4000);}save();render();return}S.elapsedWork+=d;S.cycleMin=(S.cycleMin+d)%CFG.CYCLE;const c=S.cycleMin;if(c>=CFG.WELLNESS_AT&&c<CFG.WELLNESS_AT+CFG.WELLNESS_LEN){if(!S.wellnessActive){S.wellnessActive=true;addLog("파티가 잠시 몸을 풀었습니다.","wellness");say(["너무 오래 앉아 있었다면 잠깐 일어나자!","50분 탐험 완료! 잠깐 일어나 움직여요.","어깨 한번 쭉 펴볼까요?","물 한 잔 마시고 다시 출발!"][Math.floor(Math.random()*4)],5500)}}else S.wellnessActive=false;if(S.phase==="work"&&S.elapsedWork>=CFG.WORK_MIN){S.phase="overtime";addLog("정규 근무가 끝났습니다. 자동으로 야근 환경으로 전환합니다.","ot");say("정규 근무 종료. 아직 탐험 중이므로 야근 모드로 전환합니다.",5000)}if(!S.wellnessActive){if(Math.floor(S.elapsedWork)%CFG.MOVE_EVERY_MIN===0)moveParty();if(Math.random()<.18){const g=1+Math.floor(Math.random()*5);if(S.phase==="work"){S.goldFound+=g;if(Math.random()<.3)say(`보물 발견 · +${g}G`)}else{S.otCoin+=1;if(Math.random()<.25)say("야근수당 +1◆")}}}save();render()}
/* EVENT ENGINE v2 ---------------------------------------------------------

window.expInfo=()=>openModal(`<div class="modalTitle">원정 정보</div><div class="formRow"><span>현재층</span><b>B${S.floor}F</b></div><div class="formRow"><span>근무시간</span><b>${Math.floor(S.elapsedWork/60)}h ${Math.floor(S.elapsedWork%60)}m</b></div><div class="formRow"><span>발견 Gold</span><b>${S.goldFound}G</b></div><div class="formRow"><span>지급한도</span><b>${S.dailyCap}G</b></div><div class="formRow"><span>상태</span><b>${S.phase==="overtime"?'야근':'정규근무'}</b></div><button class="full" onclick="infoMenu()">돌아가기</button>`);
window.partyInfo=()=>openModal(`<div class="modalTitle">파티 정보 · 조회 전용</div>${activeParty().map(c=>`<div class="formRow"><span>${c.name} · ${c.job}</span><span class="traits">${c.traits.map(t=>`<i class="chip">${t}</i>`).join("")}</span></div>`).join("")}<button class="full" onclick="infoMenu()">돌아가기</button>`);
window.logInfo=()=>openModal(`<div class="modalTitle">오늘의 원정 로그</div>${S.logs.slice().reverse().map(l=>`<div class="menuRow ${l.kind==="rare"?"rareLogEntry":""}" style="font-size:10px">${l.at} · ${l.t}</div>`).join("")||'<div class="subtle">기록 없음</div>'}<button class="full" onclick="infoMenu()">돌아가기</button>`);
window.receiptInfo=()=>openModal(`<div class="modalTitle">정산 기록</div><div class="subtle" style="margin-bottom:8px">정산표는 다음 출근 후 원정 중에 확인하는 기록입니다.</div>${S.receipts.slice().reverse().map(r=>`<div class="menuRow" onclick="receiptById('${r.id}')">${r.date} · ${r.id} · B${r.floor}F</div>`).join("")||'<div class="subtle">저장된 전표가 없습니다.</div>'}<button class="full" onclick="infoMenu()">돌아가기</button>`);window.receiptById=id=>{const r=S.receipts.find(x=>x.id===id);if(!r)return;openModal(`<div class="receipt">전표번호 ${r.id}\n날짜 ${r.date}\n최종층 B${r.floor}F\n발견 ${r.gold}G\n실지급 ${r.paid}G\n왕국귀속 ${r.tax}G\n야근수당 ${r.ot}◆</div><button class="full" onclick="receiptInfo()">돌아가기</button>`)};
window.settingsMenu=()=>openModal(`<div class="modalTitle">설정</div><div class="formRow"><span>점심 시작</span><input id="ls" type="time" value="${S.lunchStart}"></div><div class="formRow"><span>점심 종료</span><input id="le" type="time" value="${S.lunchEnd}"></div><button class="full" onclick="saveSettings()">저장</button><button class="full" onclick="openMenu()">돌아가기</button>`);window.saveSettings=()=>{S.lunchStart=$("#ls").value;S.lunchEnd=$("#le").value;save();say("점심시간 설정을 저장했습니다.");openMenu()};
window.partySetup=()=>{const active=new Set(S.partyIds);const current=S.characters.filter(c=>active.has(c.id));const waiting=S.characters.filter(c=>!active.has(c.id));const row=(c)=>`<div class="formRow" style="align-items:flex-start;gap:8px"><div style="flex:1;min-width:0"><div><b>${c.job} · ${c.name}</b></div><div class="traits" style="margin-top:7px">${(c.traits||[]).slice(0,3).map(t=>`<i class="chip">${t}</i>`).join("")||`<i class="chip">특징 없음</i>`}</div></div><button type="button" onclick="editCharacterById('${c.id}')" class="compactCtl">EDIT</button><button type="button" onclick="toggleParty('${c.id}')" class="compactCtl">${active.has(c.id)?'제외':'편성'}</button></div>`;openModal(`<div class="modalTitle" style="text-align:left">파티 구성 · 근무 설정</div><div class="subtle" style="margin-bottom:6px">현재 파티 ${current.length}/${CFG.MAX_PARTY} · 보유 캐릭터 ${S.characters.length}/${CFG.MAX_CHARACTERS}</div><div class="editSection">현재 파티</div>${current.map(row).join('')||'<div class="subtle">편성된 캐릭터가 없습니다.</div>'}<div class="editSection">대기 캐릭터</div>${waiting.map(row).join('')||'<div class="subtle">대기 캐릭터가 없습니다.</div>'}<button class="full" onclick="newCharacter()" ${S.characters.length>=CFG.MAX_CHARACTERS?'disabled':''}>+ 캐릭터 추가 (${S.characters.length}/${CFG.MAX_CHARACTERS})</button><div class="formRow"><span>점심 시작</span><input id="pls" class="compactCtl" type="time" value="${S.lunchStart}"></div><div class="formRow"><span>점심 종료</span><input id="ple" class="compactCtl" type="time" value="${S.lunchEnd}"></div><div class="partySetupActions"><button class="full" onclick="savePartySetup()">저장</button><button class="full" onclick="closeModal()">돌아가기</button></div>`)};
window.toggleParty=(id)=>{const p=S.partyIds.indexOf(id);if(p>=0){S.partyIds.splice(p,1)}else{if(S.partyIds.length>=CFG.MAX_PARTY){say(`파티는 최대 ${CFG.MAX_PARTY}명까지 편성할 수 있습니다.`);return}S.partyIds.push(id)}save();partySetup()};
window.newCharacter=()=>{if(S.characters.length>=CFG.MAX_CHARACTERS){say(`캐릭터는 최대 ${CFG.MAX_CHARACTERS}명까지 생성할 수 있습니다.`);return}const id='c'+Date.now();S.characters.push({id,name:'새 캐릭터',gender:'남',glasses:false,hair:'짧음',job:'기사',stats:{STR:1,VIT:1,DEX:1,INT:1,LUK:1},traits:[]});save();editCharacterById(id,true)};
let editingCharIndex=-1,editingTraits=[];
window.editCharacterById=(id,isNew=false)=>{editingCharIndex=S.characters.findIndex(c=>c.id===id);const c=S.characters[editingCharIndex];editingTraits=[...(c.traits||[])].slice(0,3);openModal(`<div class="modalTitle">CHARACTER EDIT</div><div class="formRow"><span>이름</span><input id="ceName" maxlength="12" value="${c.name.replaceAll('&','&amp;').replaceAll('\"','&quot;').replaceAll('<','&lt;').replaceAll('>','&gt;')}"></div><div class="editSection">성별</div><div class="choiceRow"><button id="genderM" class="choiceBtn ${c.gender==='남'?'on':''}" onclick="setEditChoice('gender','남')">남</button><button id="genderF" class="choiceBtn ${c.gender==='여'?'on':''}" onclick="setEditChoice('gender','여')">여</button></div><input type="hidden" id="ceGender" value="${c.gender}"><div class="formRow"><span>직업</span><select id="ceJob"><option ${c.job==='기사'?'selected':''}>기사</option><option ${c.job==='레인저'?'selected':''}>레인저</option><option ${c.job==='마법사'?'selected':''}>마법사</option><option ${c.job==='성직자'?'selected':''}>성직자</option></select></div><div class="formRow"><span>머리 길이</span><select id="ceHair"><option ${c.hair==='짧음'?'selected':''}>짧음</option><option ${c.hair==='중간'?'selected':''}>중간</option><option ${c.hair==='김'?'selected':''}>김</option></select></div><div class="formRow"><span>안경</span><select id="ceGlasses"><option value="false" ${!c.glasses?'selected':''}>OFF</option><option value="true" ${c.glasses?'selected':''}>ON</option></select></div><div class="editSection">STATUS · 1~999</div><div class="statGrid">${['STR','VIT','DEX','INT','LUK'].map(k=>`<label class="statBox">${k}<input id="stat${k}" type="number" min="1" max="999" value="${c.stats?.[k]??1}"></label>`).join('')}</div><div class="editSection">특징 · 최대 3개 <span id="traitCount" class="subtle">(${editingTraits.length}/3)</span></div><div class="traitPick">${TRAITS.map(t=>`<button type="button" class="choiceBtn ${editingTraits.includes(t)?'on':''}" data-trait="${t}" onclick="toggleEditTrait('${t}',this)">${t}</button>`).join('')}</div><div class="editorActions"><button onclick="saveCharacterEdit()">저장</button><button onclick="partySetup()">취소</button></div><button class="full" style="margin-top:7px" onclick="deleteCharacter()">캐릭터 삭제</button>`)};
window.setEditChoice=(kind,val)=>{if(kind==='gender'){$('#ceGender').value=val;$('#genderM').classList.toggle('on',val==='남');$('#genderF').classList.toggle('on',val==='여')}};
window.toggleEditTrait=(t,btn)=>{const p=editingTraits.indexOf(t);if(p>=0){editingTraits.splice(p,1);btn.classList.remove('on')}else{if(editingTraits.length>=3){say('특징은 최대 3개까지 선택할 수 있습니다.');return}editingTraits.push(t);btn.classList.add('on')}const n=$('#traitCount');if(n)n.textContent=`(${editingTraits.length}/3)`};
window.saveCharacterEdit=()=>{const i=editingCharIndex,c=S.characters[i];if(!c)return;const name=$('#ceName').value.trim();if(!name){say('이름을 입력해주세요.');return}const stats={};for(const k of ['STR','VIT','DEX','INT','LUK']){let v=parseInt($('#stat'+k).value,10);if(!Number.isFinite(v))v=1;stats[k]=Math.max(1,Math.min(999,v))}c.name=name;c.gender=$('#ceGender').value;c.job=$('#ceJob').value;c.hair=$('#ceHair').value;c.glasses=$('#ceGlasses').value==='true';c.stats=stats;c.traits=[...editingTraits];save();partySetup()};
window.deleteCharacter=()=>{const c=S.characters[editingCharIndex];if(!c)return;if(!confirm(`${c.name} 캐릭터를 삭제하시겠습니까?`))return;S.partyIds=S.partyIds.filter(id=>id!==c.id);S.characters.splice(editingCharIndex,1);save();partySetup()};
window.savePartySetup=()=>{S.lunchStart=$("#pls").value;S.lunchEnd=$("#ple").value;save();closeModal();render()};
function reset(){localStorage.removeItem(CFG.SAVE);S=def();render()}window.resetGame=reset;
render();setInterval(()=>{if(S.screen==="town"){const d=document.querySelector(".date"),c=document.querySelector(".clock");if(d)d.textContent=dateText();if(c)c.textContent=`${weekText()} · ${timeText()}`}},1000);setInterval(minuteTick,CFG.DEMO?CFG.DEMO_MINUTE_MS:1000);setInterval(save,3000);
</script></body></html>
