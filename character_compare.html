const roles=["기사","레인저","마법사","성직자","바드"];
const grid=document.getElementById("grid");
const imgs=[];
roles.forEach(role=>{
  const r=document.createElement("div"); r.className="role"; r.textContent=role;
  const a=document.createElement("div"); a.className="cell";
  const ai=document.createElement("img"); ai.className="sprite ox"; ai.alt=role+" 0x72"; ai.src=DATA.ox[role][0];
  const at=document.createElement("span"); at.className="tag"; at.textContent="0x72"; a.append(ai,at);
  const b=document.createElement("div"); b.className="cell";
  const bi=document.createElement("img"); bi.className="sprite puny"; bi.alt=role+" Puny"; bi.src=DATA.puny[role][0];
  const bt=document.createElement("span"); bt.className="tag"; bt.textContent="Puny"; b.append(bi,bt);
  grid.append(r,a,b); imgs.push([ai,DATA.ox[role]],[bi,DATA.puny[role]]);
});
let running=true, tick=0, zoom=false;
setInterval(()=>{if(!running)return;tick++;imgs.forEach(([im,fs])=>im.src=fs[tick%fs.length])},260);
document.getElementById("anim").onclick=e=>{running=!running;e.currentTarget.textContent="애니메이션 "+(running?"ON":"OFF");e.currentTarget.classList.toggle("on",running)};
document.getElementById("scale").onclick=e=>{zoom=!zoom;document.querySelectorAll(".ox").forEach(x=>{x.style.width=zoom?"80px":"";x.style.height=zoom?"140px":""});document.querySelectorAll(".puny").forEach(x=>{x.style.width=zoom?"120px":"";x.style.height=zoom?"120px":""});e.currentTarget.textContent=zoom?"기본 크기":"크기 +1"};
</script>
